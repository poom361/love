<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Loy Krathong Season 🪷✨</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mali', cursive, sans-serif; user-select: none; }
  body {
    background: linear-gradient(180deg, #2b1055 0%, #5e2a84 35%, #7b42b8 100%);
    color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; position: relative;
  }
  .skyline {
    position: absolute; top: 18%; width: 100%; height: 120px; background: #1a0836;
    clip-path: polygon(0% 100%, 0% 60%, 10% 60%, 15% 30%, 20% 60%, 35% 60%, 40% 20%, 42% 10%, 44% 20%, 48% 60%, 60% 60%, 65% 35%, 70% 60%, 82% 60%, 86% 25%, 90% 60%, 100% 60%, 100% 100%);
    z-index: 1;
  }
  .river {
    position: absolute; top: calc(18% + 118px); bottom: 0; width: 100%;
    background: radial-gradient(circle at 50% 20%, #8c52ff, #5c259c); z-index: 2; overflow: hidden;
  }
  .sparkle {
    position: absolute; width: 4px; height: 4px; background: rgba(255,255,255,0.6); border-radius: 50%;
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }

  .score-board {
    margin-top: 30px; background: rgba(255,255,255,0.2); backdrop-filter: blur(5px);
    padding: 10px 25px; border-radius: 30px; font-size: 1.2rem; font-weight: 700; z-index: 10;
    border: 1px solid rgba(255,255,255,0.4);
  }

  .krathong-item {
    position: absolute; font-size: 45px; cursor: pointer; z-index: 5;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3)); transition: transform 0.1s;
  }
  .krathong-item:active { transform: scale(0.8); }

  .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; z-index: 10; position: relative; }
  .screen.active { display: flex; }

  .big-krathong {
    font-size: 130px; cursor: pointer; animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 10px 20px rgba(255,105,180,0.5)); position: relative; text-align: center;
  }
  .question-mark {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    font-size: 50px; color: #ff69b4; font-weight: bold; text-shadow: 0 0 10px white;
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

  .puzzle-box {
    background: #fff0f6; padding: 20px; border-radius: 25px; width: 90%; max-width: 360px;
    text-align: center; color: #d63384; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .puzzle-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 270px; height: 270px;
    margin: 15px auto; background: #ffc2d1; padding: 4px; border-radius: 12px;
  }
  .tile {
    width: 100%; height: 100%; background-size: 270px 270px; border-radius: 6px; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .tile.selected { outline: 3px solid #ff1493; transform: scale(0.95); z-index: 2; }

  .couple-frame {
    width: 150px; height: 180px; border-radius: 20px 20px 0 0; object-fit: cover;
    border: 4px solid white; margin-bottom: -45px; z-index: 4; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    cursor: pointer; animation: float 3s ease-in-out infinite;
  }
  .hint-text { margin-top: 20px; background: rgba(0,0,0,0.3); padding: 8px 20px; border-radius: 20px; font-size: 0.95rem; }

  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    z-index: 50; align-items: center; justify-content: center; padding: 20px;
  }
  .modal.active { display: flex; }
  .wish-card {
    background: #fff0f6; color: #c2185b; width: 100%; max-width: 340px; padding: 25px;
    border-radius: 25px; text-align: center; box-shadow: 0 10px 30px rgba(255,105,180,0.4);
    border: 3px solid #ffb3c6;
  }
  .wish-text { margin: 15px 0 20px; line-height: 1.7; font-size: 0.95rem; min-height: 150px; white-space: pre-line; }
  .close-btn {
    background: #ff4d88; color: white; border: none; padding: 10px 30px; border-radius: 20px;
    font-size: 1rem; font-weight: bold; cursor: pointer;
  }
</style>
</head>
<body>

<div class="skyline"></div>
<div class="river" id="river"></div>

<div class="screen active" id="screen1">
  <div class="score-board">เก็บกระทง: <span id="score">0</span> / 20</div>
</div>

<div class="screen" id="screen2">
  <div class="big-krathong" onclick="goToPuzzle()">
    <div class="question-mark">?</div>
    🪷
  </div>
  <div class="hint-text">แตะที่กระทงสิ</div>
</div>

<div class="screen" id="screen3">
  <div class="puzzle-box">
    <h3>🧩 ช่วยต่อจิ๊กซอว์หน่อยย</h3>
    <p style="font-size: 0.8rem; color: #888; margin-top: 4px;">แตะสลับช่องเพื่อต่อภาพให้สมบูรณ์ 💕</p>
    <div class="puzzle-grid" id="grid"></div>
    <p id="puzzle-status" style="font-weight: bold; min-height: 24px;"></p>
  </div>
</div>

<div class="screen" id="screen4">
  <img id="final-img" class="couple-frame" onclick="openWish()" alt="รูปคู่ของเรา">
  <div class="big-krathong" onclick="openWish()" style="z-index: 5;">🪷</div>
  <div class="hint-text">ลองแตะที่รูปของเราดูสิ ✨</div>
</div>

<div class="modal" id="wishModal">
  <div class="wish-card">
    <h3>✨ คำอธิษฐาน ✨</h3>
    <div class="wish-text" id="typedText"></div>
    <button class="close-btn" onclick="closeWish()">ปิด</button>
  </div>
</div>

<script>
  const IMAGE_URL = "https://postimg.cc"; 
  
  const WISH_MESSAGE = `ลอยกระทงปีนี้
เค้าขอให้เธอมีความสุขมากๆ นะ
ขอให้สุขภาพแข็งแรง ไม่เจ็บไม่ป่วย
ไม่ว่าจะต้องเหนื่อยกับงานหรือเจอเรื่องอะไร
ก็ขอให้ผ่านไปได้ด้วยดี
ขอให้เรื่องที่ไม่สบายใจลอยหายไปกับสายน้ำ
มีแต่สิ่งดีๆ และคนใจดีเข้ามาในชีวิต
ขอให้คืนนี้เป็นคืนที่ดีของเธอ
ขอให้ทุกคำอธิษฐานเป็นจริง
ปล่อยความทุกข์ ความเหนื่อย
และเรื่องไม่ดีให้ลอยไปกับกระทง
ขอให้ทุกวันของเธอเป็นวันที่ดี
และมีรอยยิ้มอยู่เสมอนะ
สุดท้ายเค้าขอให้เราอยู่ข้างๆ กัน
คอยเป็นกำลังใจและเป็นความสุขให้กัน
แบบนี้ไปนานๆ เลยนะ 🥰💕`;

  document.getElementById('final-img').src = IMAGE_URL;

  const river = document.getElementById('river');
  for(let i=0; i<40; i++) {
    let s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.animationDelay = Math.random()*2 + 's';
    river.appendChild(s);
  }

  let score = 0;
  let spawnInterval = setInterval(() => {
    if(score >= 20) return;
    const k = document.createElement('div');
    k.className = 'krathong-item';
    k.innerText = '🪷';
    k.style.top = (35 + Math.random()*55) + '%';
    k.style.left = '-60px';
    document.getElementById('screen1').appendChild(k);

    let pos = -60;
    let speed = 2 + Math.random()*2.5;
    let move = setInterval(() => {
      pos += speed;
      k.style.left = pos + 'px';
      if(pos > window.innerWidth + 60) { clearInterval(move); k.remove(); }
    }, 20);

    k.onclick = () => {
      score++;
      document.getElementById('score').innerText = score;
      clearInterval(move);
      k.remove();
      if(score >= 20) {
        clearInterval(spawnInterval);
        setTimeout(() => switchScreen('screen2'), 400);
      }
    };
  }, 550);

  function switchScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  let order =;
  let selectedIdx = null;

  function goToPuzzle() {
    switchScreen('screen3');
    do { order.sort(() => Math.random() - 0.5); } while (isSolved());
    renderPuzzle();
  }

  function renderPuzzle() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    order.forEach((val, idx) => {
      const tile = document.createElement('div');
      tile.className = 'tile' + (selectedIdx === idx ? ' selected' : '');
      tile.style.backgroundImage = `url('${IMAGE_URL}')`;
      const row = Math.floor(val / 3);
      const col = val % 3;
      tile.style.backgroundPosition = `-${col * 90}px -${row * 90}px`;
      tile.onclick = () => handleTileClick(idx);
      grid.appendChild(tile);
    });
  }

  function handleTileClick(idx) {
    if(selectedIdx === null) {
      selectedIdx = idx;
    } else {
      [order[selectedIdx], order[idx]] = [order[idx], order[selectedIdx]];
      selectedIdx = null;
      if(isSolved()) {
        renderPuzzle();
        document.getElementById('puzzle-status').innerText = 'เก่งที่สุดเลย~ 🎉';
        setTimeout(() => switchScreen('screen4'), 1500);
        return;
      }
    }
    renderPuzzle();
  }

  function isSolved() { return order.every((v, i) => v === i); }

  let typingTimer;
  function openWish() {
    document.getElementById('wishModal').classList.add('active');
    const el = document.getElementById('typedText');
    el.innerHTML = '';
    let i = 0;
    clearInterval(typingTimer);
    typingTimer = setInterval(() => {
      if(i < WISH_MESSAGE.length) {
        el.innerHTML += WISH_MESSAGE.charAt(i);
        i++;
      } else { clearInterval(typingTimer); }
    }, 45);
  }

  function closeWish() {
    document.getElementById('wishModal').classList.remove('active');
    clearInterval(typingTimer);
  }
</script>
</body>
    </html>
