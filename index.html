<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Loy Krathong</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mali', sans-serif; user-select: none; }
  body {
    background: linear-gradient(180deg, #2b1055 0%, #5e2a84 35%, #7b42b8 100%);
    color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; position: relative;
  }
  .skyline {
    position: absolute; top: 18%; width: 100%; height: 120px; background: #1a0836;
    clip-path: polygon(0% 100%, 0% 60%, 10% 60%, 15% 30%, 20% 60%, 35% 60%, 40% 20%, 42% 10%, 44% 20%, 48% 60%, 60% 60%, 65% 35%, 70% 60%, 82% 60%, 86% 25%, 90% 60%, 100% 60%, 100% 100%);
    z-index: 1;
  }
  .river {
    position: absolute; top: calc(18% + 118px); bottom: 0; width: 100%;
    background: radial-gradient(circle at 50% 20%, #8c52ff, #5c259c); z-index: 2;
  }
  .score-board {
    position: absolute; top: 30px; background: rgba(255,255,255,0.2); backdrop-filter: blur(5px);
    padding: 10px 25px; border-radius: 30px; font-size: 1.2rem; font-weight: 700; z-index: 20;
    border: 1px solid rgba(255,255,255,0.4);
  }
  .k-btn {
    position: absolute; font-size: 48px; cursor: pointer; z-index: 30;
    animation: bob 2s ease-in-out infinite alternate;
  }
  @keyframes bob { from { transform: translateY(0px) translateX(-5px); } to { transform: translateY(-10px) translateX(5px); } }
  .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; z-index: 10; position: relative; }
  .screen.active { display: flex; }
  .big-krathong {
    font-size: 130px; cursor: pointer; animation: bob 2.5s ease-in-out infinite alternate;
    filter: drop-shadow(0 10px 20px rgba(255,105,180,0.5)); position: relative; text-align: center;
  }
  .question-mark {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    font-size: 50px; color: #ff69b4; font-weight: bold; text-shadow: 0 0 10px white;
  }
  .puzzle-box {
    background: #fff0f6; padding: 20px; border-radius: 25px; width: 90%; max-width: 360px;
    text-align: center; color: #d63384; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .puzzle-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 270px; height: 270px;
    margin: 15px auto; background: #ffc2d1; padding: 4px; border-radius: 12px;
  }
  .tile {
    width: 84px; height: 84px; border-radius: 6px; cursor: pointer; overflow: hidden; position: relative; background: #ffe5ec;
  }
  .tile img {
    width: 260px; height: 260px; object-fit: cover; position: absolute; pointer-events: none;
  }
  .tile.selected { outline: 3px solid #ff1493; transform: scale(0.95); z-index: 2; }
  .couple-frame {
    width: 150px; height: 180px; border-radius: 20px 20px 0 0; object-fit: cover;
    border: 4px solid white; margin-bottom: -45px; z-index: 4; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    cursor: pointer;
  }
  .hint-text { margin-top: 20px; background: rgba(0,0,0,0.3); padding: 8px 20px; border-radius: 20px; font-size: 0.95rem; }
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    z-index: 50; align-items: center; justify-content: center; padding: 20px;
  }
  .modal.active { display: flex; }
  .wish-card {
    background: #fff0f6; color: #c2185b; width: 100%; max-width: 340px; padding: 25px;
    border-radius: 25px; text-align: center; box-shadow: 0 10px 30px rgba(255,105,180,0.4);
    border: 3px solid #ffb3c6;
  }
  .wish-text { margin: 15px 0 20px; line-height: 1.7; font-size: 0.95rem; min-height: 150px; white-space: pre-line; }
  .close-btn {
    background: #ff4d88; color: white; border: none; padding: 10px 30px; border-radius: 20px;
    font-size: 1rem; font-weight: bold; cursor: pointer;
  }
</style>
</head>
<body>

<div class="skyline"></div>
<div class="river"></div>

<div class="screen active" id="screen1">
  <div class="score-board">เก็บกระทง: <span id="score">0</span> / 20</div>
  <div class="k-btn" style="top:38%; left:10%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:42%; left:35%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:37%; left:62%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:44%; left:80%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:52%; left:18%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:50%; left:48%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:54%; left:72%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:60%; left:8%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:62%; left:30%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:59%; left:55%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:64%; left:82%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:70%; left:15%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:72%; left:42%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:69%; left:68%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:78%; left:10%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:80%; left:32%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:77%; left:54%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:81%; left:76%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:86%; left:22%;" onclick="pick(this)">🪷</div>
  <div class="k-btn" style="top:87%; left:60%;" onclick="pick(this)">🪷</div>
</div>

<div class="screen" id="screen2">
  <div class="big-krathong" onclick="goToPuzzle()">
    <div class="question-mark">?</div>
    🪷
  </div>
  <div class="hint-text">แตะที่กระทงสิ</div>
</div>

<div class="screen" id="screen3">
  <div class="puzzle-box">
    <h3>🧩 ช่วยต่อจิ๊กซอว์หน่อยย</h3>
    <p style="font-size: 0.8rem; color: #888; margin-top: 4px;">แตะสลับช่องเพื่อต่อภาพให้สมบูรณ์ 💕</p>
    <div class="puzzle-grid" id="grid"></div>
    <p id="puzzle-status" style="font-weight: bold; min-height: 24px;"></p>
  </div>
</div>

<div class="screen" id="screen4">
  <img src="1795272429612.jpg" class="couple-frame" onclick="openWish()" alt="รูปคู่">
  <div class="big-krathong" onclick="openWish()" style="z-index: 5;">🪷</div>
  <div class="hint-text">ลองแตะที่รูปของเราดูสิ ✨</div>
</div>

<div class="modal" id="wishModal">
  <div class="wish-card">
    <h3>✨ คำอธิษฐาน ✨</h3>
    <div class="wish-text" id="typedText"></div>
    <button class="close-btn" onclick="closeWish()">ปิด</button>
  </div>
</div>

<script>
  const MY_PHOTO = "1795272429612.jpg";

  let score = 0;
  function pick(el) {
    el.style.display = 'none';
    score++;
    document.getElementById('score').innerText = score;
    if(score >= 20) {
      setTimeout(function() { switchScreen('screen2'); }, 300);
    }
  }

  function switchScreen(id) {
    document.getElementById('screen1').classList.remove('active');
    document.getElementById('screen2').classList.remove('active');
    document.getElementById('screen3').classList.remove('active');
    document.getElementById('screen4').classList.remove('active');
    document.getElementById(id).classList.add('active');
  }

  let order = new Array(1, 0, 2, 3, 4, 5, 6, 7, 8);
  let selectedIdx = null;

  function goToPuzzle() {
    switchScreen('screen3');
    renderPuzzle();
  }

  function renderPuzzle() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for(let i = 0; i < 9; i++) {
      let val = order.at(i);
      const tile = document.createElement('div');
      tile.className = 'tile' + (selectedIdx === i ? ' selected' : '');
      const img = document.createElement('img');
      img.src = MY_PHOTO;
      const row = Math.floor(val / 3);
      const col = val % 3;
      img.style.left = '-' + (col * 86) + 'px';
      img.style.top = '-' + (row * 86) + 'px';
      tile.appendChild(img);
      tile.onclick = function() { handleTileClick(i); };
      grid.appendChild(tile);
    }
  }

  function handleTileClick(idx) {
    if(selectedIdx === null) {
      selectedIdx = idx;
    } else {
      let temp = order.at(selectedIdx);
      order.splice(selectedIdx, 1, order.at(idx));
      order.splice(idx, 1, temp);
      selectedIdx = null;
      if(isSolved()) {
        renderPuzzle();
        document.getElementById('puzzle-status').innerText = 'เก่งที่สุดเลย~ 🎉';
        setTimeout(function() { switchScreen('screen4'); }, 1500);
        return;
      }
    }
    renderPuzzle();
  }

  function isSolved() {
    for(let i = 0; i < 9; i++) {
      if(order.at(i) !== i) return false;
    }
    return true;
  }

  const WISH_MESSAGE = "ลอยกระทงปีนี้\nเค้าขอให้เธอมีความสุขมากๆ นะ\nขอให้สุขภาพแข็งแรง ไม่เจ็บไม่ป่วย\nไม่ว่าจะต้องเหนื่อยกับงานหรือเจอเรื่องอะไร\nก็ขอให้ผ่านไปได้ด้วยดี\nขอให้เรื่องที่ไม่สบายใจลอยหายไปกับสายน้ำ\nมีแต่สิ่งดีๆ และคนใจดีเข้ามาในชีวิต\nขอให้คืนนี้เป็นคืนที่ดีของเธอ\nขอให้ทุกคำอธิษฐานเป็นจริง\nปล่อยความทุกข์ ความเหนื่อย\nและเรื่องไม่ดีให้ลอยไปกับกระทง\nขอให้ทุกวันของเธอเป็นวันที่ดี\nและมีรอยยิ้มอยู่เสมอนะ\nสุดท้ายเค้าขอให้เราอยู่ข้างๆ กัน\nคอยเป็นกำลังใจและเป็นความสุขให้กัน\nแบบนี้ไปนานๆ เลยนะ 🥰💕";

  let typingTimer;
  function openWish() {
    document.getElementById('wishModal').classList.add('active');
    const el = document.getElementById('typedText');
    el.innerText = '';
    let i = 0;
    clearInterval(typingTimer);
    typingTimer = setInterval(function() {
      if(i < WISH_MESSAGE.length) {
        el.innerText += WISH_MESSAGE.charAt(i);
        i++;
      } else { clearInterval(typingTimer); }
    }, 45);
  }

  function closeWish() {
    document.getElementById('wishModal').classList.remove('active');
